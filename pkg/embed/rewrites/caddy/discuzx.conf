@topic path_regexp topic ^([^\.]*)/topic-(.+)\.html$
rewrite @topic {re.topic.1}/portal.php?mod=topic&topic={re.topic.2}&{query}
@article path_regexp article ^([^\.]*)/article-([0-9]+)-([0-9]+)\.html$
rewrite @article {re.article.1}/portal.php?mod=view&aid={re.article.2}&page={re.article.3}&{query}
@forum path_regexp forum ^([^\.]*)/forum-(\w+)-([0-9]+)\.html$
rewrite @forum {re.forum.1}/forum.php?mod=forumdisplay&fid={re.forum.2}&page={re.forum.3}&{query}
@thread path_regexp thread ^([^\.]*)/thread-([0-9]+)-([0-9]+)-([0-9]+)\.html$
rewrite @thread {re.thread.1}/forum.php?mod=viewthread&tid={re.thread.2}&extra=page%3D{re.thread.4}&page={re.thread.3}&{query}
@group path_regexp group ^([^\.]*)/group-([0-9]+)-([0-9]+)\.html$
rewrite @group {re.group.1}/forum.php?mod=group&fid={re.group.2}&page={re.group.3}&{query}
@space path_regexp space ^([^\.]*)/space-(username|uid)-(.+)\.html$
rewrite @space {re.space.1}/home.php?mod=space&{re.space.2}={re.space.3}&{query}
@blog path_regexp blog ^([^\.]*)/blog-([0-9]+)-([0-9]+)\.html$
rewrite @blog {re.blog.1}/home.php?mod=space&uid={re.blog.2}&do=blog&id={re.blog.3}&{query}
@index path_regexp index ^([^\.]*)/(fid|tid)-([0-9]+)\.html$
rewrite @index {re.index.1}/index.php?action={re.index.2}&value={re.index.3}&{query}
@plugin path_regexp plugin ^([^\.]*)/([a-z]+[a-z0-9_]*)-([a-z0-9_\-]+)\.html$
rewrite @plugin {re.plugin.1}/plugin.php?id={re.plugin.2}:{re.plugin.3}&{query}
@notfound {
	not file {
		try_files {path} {path}/
	}
}
respond @notfound 404
