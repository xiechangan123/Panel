try_files {path} {path}/ /index.php?{query}
@wpadmin {
	path */wp-admin
	not file {
		try_files {path} {path}/
	}
}
redir @wpadmin {path}/{?query} 301
@wpfiles {
	path_regexp wpfiles ^/([^/]+)?(/wp-(content|admin|includes).*)
	not file {
		try_files {path} {path}/
	}
}
rewrite @wpfiles {re.wpfiles.2}
@wpphp {
	path_regexp wpphp ^/([^/]+)?(/[^/]+\.php)$
	not file {
		try_files {path} {path}/
	}
}
rewrite @wpphp {re.wpphp.2}
