# Rewrite rules only apply to requests that aren't a real file or directory
@notfound {
	not file {
		try_files {path} {path}/
	}
}
route @notfound {
	@index path_regexp index ^/index\.html
	rewrite @index /index.php
	@category path_regexp category ^/category$
	rewrite @category /index.php
	@feedc path_regexp feedc ^/feed-c([0-9]+)\.xml$
	rewrite @feedc /feed.php?cat={re.feedc.1}&{query}
	@feedb path_regexp feedb ^/feed-b([0-9]+)\.xml$
	rewrite @feedb /feed.php?brand={re.feedb.1}&{query}
	@feed path_regexp feed ^/feed\.xml$
	rewrite @feed /feed.php
	@cat1 path_regexp cat1 ^/category-([0-9]+)-b([0-9]+)-min([0-9]+)-max([0-9]+)-attr([^-]*)-([0-9]+)-(.+)-([a-zA-Z]+)(.*)\.html$
	rewrite @cat1 /category.php?id={re.cat1.1}&brand={re.cat1.2}&price_min={re.cat1.3}&price_max={re.cat1.4}&filter_attr={re.cat1.5}&page={re.cat1.6}&sort={re.cat1.7}&order={re.cat1.8}&{query}
	@cat2 path_regexp cat2 ^/category-([0-9]+)-b([0-9]+)-min([0-9]+)-max([0-9]+)-attr([^-]*)(.*)\.html$
	rewrite @cat2 /category.php?id={re.cat2.1}&brand={re.cat2.2}&price_min={re.cat2.3}&price_max={re.cat2.4}&filter_attr={re.cat2.5}&{query}
	@cat3 path_regexp cat3 ^/category-([0-9]+)-b([0-9]+)-([0-9]+)-(.+)-([a-zA-Z]+)(.*)\.html$
	rewrite @cat3 /category.php?id={re.cat3.1}&brand={re.cat3.2}&page={re.cat3.3}&sort={re.cat3.4}&order={re.cat3.5}&{query}
	@cat4 path_regexp cat4 ^/category-([0-9]+)-b([0-9]+)-([0-9]+)(.*)\.html$
	rewrite @cat4 /category.php?id={re.cat4.1}&brand={re.cat4.2}&page={re.cat4.3}&{query}
	@cat5 path_regexp cat5 ^/category-([0-9]+)-b([0-9]+)(.*)\.html$
	rewrite @cat5 /category.php?id={re.cat5.1}&brand={re.cat5.2}&{query}
	@cat6 path_regexp cat6 ^/category-([0-9]+)(.*)\.html$
	rewrite @cat6 /category.php?id={re.cat6.1}&{query}
	@goods path_regexp goods ^/goods-([0-9]+)(.*)\.html
	rewrite @goods /goods.php?id={re.goods.1}&{query}
	@artcat1 path_regexp artcat1 ^/article_cat-([0-9]+)-([0-9]+)-(.+)-([a-zA-Z]+)(.*)\.html$
	rewrite @artcat1 /article_cat.php?id={re.artcat1.1}&page={re.artcat1.2}&sort={re.artcat1.3}&order={re.artcat1.4}&{query}
	@artcat2 path_regexp artcat2 ^/article_cat-([0-9]+)-([0-9]+)(.*)\.html$
	rewrite @artcat2 /article_cat.php?id={re.artcat2.1}&page={re.artcat2.2}&{query}
	@artcat3 path_regexp artcat3 ^/article_cat-([0-9]+)(.*)\.html$
	rewrite @artcat3 /article_cat.php?id={re.artcat3.1}&{query}
	@article path_regexp article ^/article-([0-9]+)(.*)\.html$
	rewrite @article /article.php?id={re.article.1}&{query}
	@brand1 path_regexp brand1 ^/brand-([0-9]+)-c([0-9]+)-([0-9]+)-(.+)-([a-zA-Z]+)\.html
	rewrite @brand1 /brand.php?id={re.brand1.1}&cat={re.brand1.2}&page={re.brand1.3}&sort={re.brand1.4}&order={re.brand1.5}&{query}
	@brand2 path_regexp brand2 ^/brand-([0-9]+)-c([0-9]+)-([0-9]+)(.*)\.html
	rewrite @brand2 /brand.php?id={re.brand2.1}&cat={re.brand2.2}&page={re.brand2.3}&{query}
	@brand3 path_regexp brand3 ^/brand-([0-9]+)-c([0-9]+)(.*)\.html
	rewrite @brand3 /brand.php?id={re.brand3.1}&cat={re.brand3.2}&{query}
	@brand4 path_regexp brand4 ^/brand-([0-9]+)(.*)\.html
	rewrite @brand4 /brand.php?id={re.brand4.1}&{query}
	@tag path_regexp tag ^/tag-(.*)\.html
	rewrite @tag /search.php?keywords={re.tag.1}&{query}
	@snatch path_regexp snatch ^/snatch-([0-9]+)\.html$
	rewrite @snatch /snatch.php?id={re.snatch.1}&{query}
	@groupbuy path_regexp groupbuy ^/group_buy-([0-9]+)\.html$
	rewrite @groupbuy /group_buy.php?act=view&id={re.groupbuy.1}&{query}
	@auction path_regexp auction ^/auction-([0-9]+)\.html$
	rewrite @auction /auction.php?act=view&id={re.auction.1}&{query}
	@exchangeid path_regexp exchangeid ^/exchange-id([0-9]+)(.*)\.html$
	rewrite @exchangeid /exchange.php?id={re.exchangeid.1}&act=view&{query}
	@exchange1 path_regexp exchange1 ^/exchange-([0-9]+)-min([0-9]+)-max([0-9]+)-([0-9]+)-(.+)-([a-zA-Z]+)(.*)\.html$
	rewrite @exchange1 /exchange.php?cat_id={re.exchange1.1}&integral_min={re.exchange1.2}&integral_max={re.exchange1.3}&page={re.exchange1.4}&sort={re.exchange1.5}&order={re.exchange1.6}&{query}
	@exchange2 path_regexp exchange2 ^/exchange-([0-9]+)-([0-9]+)-(.+)-([a-zA-Z]+)(.*)\.html$
	rewrite @exchange2 /exchange.php?cat_id={re.exchange2.1}&page={re.exchange2.2}&sort={re.exchange2.3}&order={re.exchange2.4}&{query}
	@exchange3 path_regexp exchange3 ^/exchange-([0-9]+)-([0-9]+)(.*)\.html$
	rewrite @exchange3 /exchange.php?cat_id={re.exchange3.1}&page={re.exchange3.2}&{query}
	@exchange4 path_regexp exchange4 ^/exchange-([0-9]+)(.*)\.html$
	rewrite @exchange4 /exchange.php?cat_id={re.exchange4.1}&{query}
	# Anything left that isn't a real file or directory is a 404
	@missing {
		not file {
			try_files {path} {path}/
		}
	}
	respond @missing 404
}
