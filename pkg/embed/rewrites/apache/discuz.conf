RewriteRule ^/archiver/((fid|tid)-[\w\-]+\.html)$ /archiver/index.php?$1 [QSA,L]
RewriteRule ^/forum-([0-9]+)-([0-9]+)\.html$ /forumdisplay.php?fid=$1&page=$2 [QSA,L]
RewriteRule ^/thread-([0-9]+)-([0-9]+)-([0-9]+)\.html$ /viewthread.php?tid=$1&extra=page\%3D$3&page=$2 [QSA,L]
RewriteRule ^/space-(username|uid)-(.+)\.html$ /space.php?$1=$2 [QSA,L]
RewriteRule ^/tag-(.+)\.html$ /tag.php?name=$1 [QSA,L]
