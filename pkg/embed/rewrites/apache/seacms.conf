RewriteRule ^/frim/index(.+?)\.html$ /list/index.php?$1 [QSA,L]
RewriteRule ^/movie/index(.+?)\.html$ /detail/index.php?$1 [QSA,L]
RewriteRule ^/play/([0-9]+)-([0-9]+)-([0-9]+)\.html$ /video/index.php?$1-$2-$3 [QSA,L]
RewriteRule ^/topic/index(.+?)\.html$ /topic/index.php?$1 [QSA,L]
RewriteRule ^/topiclist/index(.+?)\.html$ /topiclist/index.php?$1 [QSA,L]
RewriteRule ^/index\.html$ /index.php [R=301,L]
RewriteRule ^/news\.html$ /news/ [R=301,L]
RewriteRule ^/part/index(.+?)\.html$ /articlelist/index.php?$1 [QSA,L]
RewriteRule ^/article/index(.+?)\.html$ /article/index.php?$1 [QSA,L]
